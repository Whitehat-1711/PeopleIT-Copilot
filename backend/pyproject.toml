[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Nishant", email = "nishantgosavi1405@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "chromadb-client>=1.5.9",
    "fastapi>=0.115.0",
    "langchain>=1.0.0",
    "langchain-community>=0.4.0",
    "langchain-core>=1.0.0",
    "langchain-google-genai>=4.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.2.22",
    "mcp>=1.0.0",
    "pydantic>=2.10.0",
    "python-dotenv>=1.0.1",
    "uvicorn>=0.32.0",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"
