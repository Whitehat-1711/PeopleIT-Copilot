services:
  postgres:
    image: postgres:17
    container_name: hr_it_postgres
    environment:
      POSTGRES_DB: company_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U admin -d company_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:latest
    container_name: hr_it_chromadb
    ports:
      - "8000:8000"
    volumes:
      - chromadata:/chroma/chroma
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: hr_it_backend
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://readonly_user:readonly_pass@postgres:5432/company_db
    env_file:
      - backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      chromadb:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: hr_it_frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_API_URL=http://backend:8001
    depends_on:
      - backend

volumes:
  pgdata:
  chromadata: